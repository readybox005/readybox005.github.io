<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>自动打开链接【同源Blob中转·完整保留登录】</title>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;}
        body {padding:20px;font-family:微软雅黑, Arial;width:950px;margin:0 auto;line-height:1.8;}
        h2 {color:#2c3e50;text-align:center;margin-bottom:20px;}
        .safe-tip{background:#e8f5e9;border:1px solid #c8e6c9;padding:10px;border-radius:6px;color:#2e7d32;margin:10px 0;font-size:13px;}
        .config {margin:15px 0;padding:10px;background:#f5f7fa;border-radius:6px;}
        .config input {width:80px;padding:6px;margin:0 5px;border:1px solid #ddd;border-radius:4px;text-align:center;}
        .speed-btns {margin:10px 0;padding:8px;background:#e8f4f8;border-radius:6px;text-align:center;}
        .speed-btns button {padding:6px 12px;margin:0 5px;font-size:14px;}
        .url-section {margin:15px 0;}
        .url-section span {color:#3498db;font-weight:bold;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
        .count-tag {color:#666;font-size:13px;font-weight:normal;}
        textarea {width:100%;height:180px;padding:10px;border:1px solid #ddd;border-radius:6px;margin:5px 0;resize:none;font-size:14px;}
        button {padding:10px 20px;margin:0 8px;border:none;border-radius:6px;font-size:16px;cursor:pointer;transition:all 0.2s;}
        button:hover {opacity:0.9;transform:scale(1.02);}
        #startBtn {background:#27ae60;color:#fff;}
        #stopBtn {background:#e74c3c;color:#fff;}
        #clearPendingBtn {background:#95a5a6;color:#fff;}
        #clearCompletedBtn {background:#6c757d;color:#fff;}
        #status {margin-top:20px;font-size:16px;color:#e74c3c;font-weight:bold;text-align:center;}
        .tips {margin-top:15px;padding:10px;background:#fff8e1;border:1px solid #ffeaa7;border-radius:6px;color:#6d4c41;font-size:13px;}
        .section-divider {height:1px;background:#eee;margin:20px 0;}
        .progress-container {margin:15px 0;padding:10px;background:#f8f9fa;border-radius:6px;}
        .progress-bar {height:10px;background:#e9ecef;border-radius:5px;overflow:hidden;margin:8px 0;}
        .progress-fill {height:100%;background:#27ae60;border-radius:5px;width:0%;transition:width 0.1s linear;}
        .progress-label {font-size:14px;color:#495057;display:flex;justify-content:space-between;}
        .log-section {margin:15px 0;}
        #logList {height:120px;overflow-y:auto;border:1px solid #ddd;border-radius:6px;padding:10px;font-size:13px;line-height:1.6;color:#333;}
        .log-success {color:#27ae60;}
        .log-error {color:#e74c3c;}
        .log-info {color:#3498db;}
    </style>
</head>
<body>
    <h2>自动打开链接【同源Blob中转·完整保留登录】</h2>

    <div class="safe-tip">
💡 核心优化：同源中转页实现自动上下滚动，不切断登录Cookie，减少阿里重复验证
    </div>

    <div class="speed-btns">
        <button id="fastSpeed">快速（间隔5-10s/观看3-5s）</button>
        <button id="normalSpeed" style="background:#3498db;color:#fff;">普通（间隔20-60s/观看8-15s）</button>
        <button id="slowSpeed">慢速（间隔60-120s/观看15-30s）</button>
    </div>

    <div class="config">
        ✅ 间隔时间：<input type="number" id="intervalMinSec" value="20" min="1" step="1"> 秒 ~ <input type="number" id="intervalMaxSec" value="60" min="1" step="1"> 秒
        ✅ 浏览停留：<input type="number" id="watchMinSec" value="8" min="1" step="1"> 秒 ~ <input type="number" id="watchMaxSec" value="15" min="1" step="1">
    </div>

    <div class="progress-container">
        <div class="progress-label">
            <span>浏览进度</span>
            <span id="watchProgressText">0% (0/0秒)</span>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="watchProgressBar"></div>
        </div>
        <div class="progress-label">
            <span>间隔进度</span>
            <span id="intervalProgressText">0% (0/0秒)</span>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="intervalProgressBar" style="background:#3498db;"></div>
        </div>
    </div>

    <div class="url-section">
        <span>📌 待执行链接（每行1条）<span class="count-tag" id="pendingCount">共0条</span></span>
        <textarea id="pendingUrlList" placeholder="粘贴阿里国际商品链接，每行一条"></textarea>
    </div>

    <div class="section-divider"></div>

    <div class="url-section">
        <span>✅ 已完成链接<span class="count-tag" id="completedCount">共0条</span></span>
        <textarea id="completedUrlList" readonly></textarea>
    </div>

    <div class="log-section">
        <span>📝 执行日志</span>
        <div id="logList"></div>
        <button id="exportLogBtn" style="margin-top:8px;padding:6px 12px;font-size:14px;">📤 导出日志</button>
    </div>

    <div style="text-align:center;margin:10px 0;">
        <button id="startBtn">▶️ 开始执行</button>
        <button id="stopBtn">⏹️ 停止执行</button>
        <button id="clearPendingBtn">🗑️ 清空待执行</button>
        <button id="clearCompletedBtn">🗑️ 清空已完成</button>
    </div>

    <div id="status">💡 就绪：同源中转模拟滚动，登录态不丢失</div>

    <div class="tips">
⚠️ 1. 浏览器弹窗请允许；2. 优先普通档位；3. HTTPS域名登录更稳定
    </div>

<script>
const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');
const clearPendingBtn = document.getElementById('clearPendingBtn');
const clearCompletedBtn = document.getElementById('clearCompletedBtn');
const intervalMinSec = document.getElementById('intervalMinSec');
const intervalMaxSec = document.getElementById('intervalMaxSec');
const watchMinSec = document.getElementById('watchMinSec');
const watchMaxSec = document.getElementById('watchMaxSec');
const pendingUrlList = document.getElementById('pendingUrlList');
const completedUrlList = document.getElementById('completedUrlList');
const status = document.getElementById('status');
const watchProgressBar = document.getElementById('watchProgressBar');
const watchProgressText = document.getElementById('watchProgressText');
const intervalProgressBar = document.getElementById('intervalProgressBar');
const intervalProgressText = document.getElementById('intervalProgressText');
const fastSpeed = document.getElementById('fastSpeed');
const normalSpeed = document.getElementById('normalSpeed');
const slowSpeed = document.getElementById('slowSpeed');
const logList = document.getElementById('logList');
const exportLogBtn = document.getElementById('exportLogBtn');
const pendingCount = document.getElementById('pendingCount');
const completedCount = document.getElementById('completedCount');

let timeout = null;
let isRunning = false;
let childWindows = [];
let watchProgressTimer = null;
let intervalProgressTimer = null;
const STORAGE_KEY = 'autoUrlOpenerData';

function refreshCount() {
    const pendingArr = pendingUrlList.value.split('\n').filter(s => s.trim());
    pendingCount.innerText = '共' + pendingArr.length + '条';
    const compArr = completedUrlList.value.split('\n').filter(s => s.trim());
    completedCount.innerText = '共' + compArr.length + '条';
}

function getRandomNumber(min, max) {
    const minNum = Number(min) || 1;
    const maxNum = Number(max) || 1;
    const finalMin = Math.min(minNum, maxNum);
    const finalMax = Math.max(minNum, maxNum);
    const base = Math.random() * (finalMax - finalMin) + finalMin;
    const drift = (Math.random() - 0.5) * 2;
    return Math.round((base + drift) * 10) / 10;
}

function fakeHumanFocus() {
    window.focus();
}

// 修复核心：不用转义，拆分script闭合标签，纯字符串拼接，Blob内正常执行JS滚动
function getProxyPageHtml(targetUrl, watchTime) {
    // 拆分script标签，防止外层JS提前截断
    const openScript = '<scr' + 'ipt>';
    const closeScript = '</scr' + 'ipt>';
    // 中转完整页面代码
    const pageBody = openScript + `
const targetLink = "${targetUrl}";
const totalViewMs = ${watchTime * 1000};
const scrollStepCount = 6;
const stepGap = totalViewMs / scrollStepCount;
let scrollStep = 0;
const scrollTimer = setInterval(()=>{
    scrollStep++;
    const scrollPercent = scrollStep / scrollStepCount;
    const maxScroll = document.body.scrollHeight - window.innerHeight;
    window.scrollTo({top: maxScroll * scrollPercent, behavior:"smooth"});
    if(scrollStep >= scrollStepCount) clearInterval(scrollTimer);
}, stepGap);
setInterval(()=>{
    const x = Math.random() * window.innerWidth;
    const y = Math.random() * window.innerHeight;
    document.dispatchEvent(new MouseEvent("mousemove",{clientX:x,clientY:y,bubbles:true}));
}, 350);
setInterval(()=>{
    const x = Math.random() * window.innerWidth;
    const y = Math.random() * window.innerHeight;
    document.dispatchEvent(new MouseEvent("click",{clientX:x,clientY:y,bubbles:true}));
}, 1300);
setTimeout(()=>{
    window.scrollTo({top:0,behavior:"smooth"});
}, totalViewMs * 0.7);
setTimeout(()=>{
    window.location.href = targetLink;
}, totalViewMs * 0.85);
` + closeScript;

    const fullHtml = `
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>浏览中转</title>
<style>body{margin:0;height:3200px;background:#ffffff;}</style>
</head>
<body>
${pageBody}
</body>
</html>
`;
    return fullHtml;
}

function safeOpenProxy(targetUrl, watchTime) {
    const proxyHtml = getProxyPageHtml(targetUrl, watchTime);
    const blob = new Blob([proxyHtml], {type: "text/html"});
    const blobUrl = URL.createObjectURL(blob);
    const win = window.open(blobUrl, '_blank', 'noopener=no,noreferrer=no');
    setTimeout(function(){URL.revokeObjectURL(blobUrl);}, 3000);
    return win;
}

function updateProgressBar(textEl, bar, current, total) {
    const percent = Math.min(Math.round((current / total) * 100), 100);
    bar.style.width = percent + '%';
    textEl.textContent = percent + '% (' + current.toFixed(1) + '/' + total.toFixed(1) + '秒)';
}

function clearProgressBars() {
    clearInterval(watchProgressTimer);
    clearInterval(intervalProgressTimer);
    watchProgressBar.style.width = '0%';
    intervalProgressBar.style.width = '0%';
    watchProgressText.textContent = '0% (0/0秒)';
    intervalProgressText.textContent = '0% (0/0秒)';
}

function waitForPageLoad(targetWin) {
    return new Promise(function(resolve) {
        let waitTime = 0;
        const maxWaitTime = 10000;
        function checkLoad() {
            waitTime += 300;
            try {
                if (targetWin.document?.readyState === 'complete' || waitTime >= maxWaitTime) resolve();
                else setTimeout(checkLoad, 300);
            } catch (e) { setTimeout(resolve, 2000); }
        }
        checkLoad();
    });
}

function updateUrlLists(executedUrl) {
    const pendingUrls = pendingUrlList.value.split('\n').filter(function(item){return item.trim();});
    const remainingPending = pendingUrls.filter(function(url){return url.trim() !== executedUrl.trim();});
    pendingUrlList.value = remainingPending.join('\n');
    const completedUrls = completedUrlList.value.split('\n').filter(function(item){return item.trim();});
    completedUrls.push(executedUrl.trim());
    completedUrlList.value = completedUrls.join('\n');
    saveToLocalStorage();
    refreshCount();
}

function addLog(message, type) {
    if(!type) type = 'info';
    const time = new Date().toLocaleTimeString();
    const logItem = document.createElement('div');
    logItem.className = 'log-' + type;
    logItem.innerText = '[' + time + '] ' + message;
    logList.appendChild(logItem);
    logList.scrollTop = logList.scrollHeight;
}

function loadFromLocalStorage() {
    const data = localStorage.getItem(STORAGE_KEY);
    if (data) {
        const parsed = JSON.parse(data);
        pendingUrlList.value = parsed.pending || '';
        completedUrlList.value = parsed.completed || '';
        logList.innerHTML = parsed.logs || '';
    }
    refreshCount();
}

function saveToLocalStorage() {
    const data = {
        pending: pendingUrlList.value,
        completed: completedUrlList.value,
        logs: logList.innerHTML
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function exportLog() {
    const logText = logList.innerText;
    const blob = new Blob([logText], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '打开链接日志_' + new Date().toLocaleDateString().replace(/\//g, '-') + '.txt';
    a.click();
    URL.revokeObjectURL(a.href);
}

async function runTask() {
    if (!isRunning) return;
    const pendingUrls = pendingUrlList.value.split('\n').filter(function(item){return item.trim();});
    if (pendingUrls.length === 0) {
        isRunning = false;
        clearProgressBars();
        const cnt = completedUrlList.value.split('\n').filter(function(item){return item.trim();}).length;
        status.innerHTML = '✅ 执行完成，累计完成 ' + cnt + ' 个链接';
        status.style.color = '#27ae60';
        addLog('✅ 全部任务执行完毕', 'success');
        return;
    }

    const currentUrl = pendingUrls[0].trim();
    const countArr = completedUrlList.value.split('\n').filter(function(item){return item.trim();});
    status.innerHTML = '🔄 正在执行第 ' + (countArr.length + 1) + ' 个链接';
    status.style.color = '#2980b9';
    addLog('开始执行：' + currentUrl);

    fakeHumanFocus();
    const watchTime = getRandomNumber(watchMinSec.value, watchMaxSec.value);
    const newWin = safeOpenProxy(currentUrl, watchTime);
    if (!newWin) {
        status.innerHTML = '❌ 请允许浏览器弹窗！';
        status.style.color = '#e74c3c';
        addLog('弹窗被浏览器拦截', 'error');
        isRunning = false;
        return;
    }
    childWindows.push(newWin);
    await waitForPageLoad(newWin);

    addLog('同源中转页模拟真人滚动浏览 ' + watchTime + ' 秒');
    let cur = 0;
    clearInterval(watchProgressTimer);
    watchProgressTimer = setInterval(function() {
        cur += 0.1;
        updateProgressBar(watchProgressText, watchProgressBar, cur, watchTime);
        if (cur >= watchTime) clearInterval(watchProgressTimer);
    }, 100);

    setTimeout(function() {
        try { newWin.close(); childWindows = childWindows.filter(function(w){return w !== newWin;}); } catch (e) {}
        updateUrlLists(currentUrl);
        addLog('✅ 浏览完成，登录会话完整保留', 'success');

        const intervalTime = getRandomNumber(intervalMinSec.value, intervalMaxSec.value);
        addLog('等待 ' + intervalTime + ' 秒后继续下一个');

        let curInt = 0;
        clearInterval(intervalProgressTimer);
        intervalProgressTimer = setInterval(function() {
            curInt += 0.1;
            updateProgressBar(intervalProgressText, intervalProgressBar, curInt, intervalTime);
            if (curInt >= intervalTime) clearInterval(intervalProgressTimer);
        }, 100);

        timeout = setTimeout(runTask, intervalTime * 1000);
    }, watchTime * 1000);
}

function validateInputs() {
    const imin = Number(intervalMinSec.value);
    const imax = Number(intervalMaxSec.value);
    const wmin = Number(watchMinSec.value);
    const wmax = Number(watchMaxSec.value);
    if (imin > imax || wmin > wmax || imin < 1 || wmin < 1) {
        status.innerText = '❌ 时间区间设置错误';
        status.style.color = '#e74c3c';
        return false;
    }
    return true;
}

startBtn.onclick = function() {
    if (isRunning) return;
    if (!pendingUrlList.value.trim()) {
        status.innerText = '❌ 请先粘贴链接';
        status.style.color = '#e74c3c';
        return;
    }
    if (!validateInputs()) return;
    isRunning = true;
    status.innerText = '✅ 任务启动，同源中转防风模式';
    status.style.color = '#27ae60';
    addLog('任务启动，同源中转模拟完整真人滑动', 'success');
    runTask();
};

stopBtn.onclick = function() {
    clearTimeout(timeout);
    clearProgressBars();
    childWindows.forEach(function(w) { try { w.close(); } catch (e) {} });
    childWindows = [];
    isRunning = false;
    status.innerText = '⏹️ 任务已停止';
    status.style.color = '#e74c3c';
    addLog('手动停止任务');
};

clearPendingBtn.onclick = function() {
    pendingUrlList.value = '';
    saveToLocalStorage();
    refreshCount();
    status.innerText = '🗑️ 已清空待执行';
    status.style.color = '#3498db';
};

clearCompletedBtn.onclick = function() {
    completedUrlList.value = '';
    saveToLocalStorage();
    refreshCount();
    status.innerText = '🗑️ 已清空已完成';
    status.style.color = '#3498db';
};

fastSpeed.onclick = function() {
    intervalMinSec.value = 5; intervalMaxSec.value = 10;
    watchMinSec.value = 3; watchMaxSec.value = 5;
    addLog('切换快速档位');
};
normalSpeed.onclick = function() {
    intervalMinSec.value = 20; intervalMaxSec.value = 60;
    watchMinSec.value = 8; watchMaxSec.value = 15;
    addLog('切换普通档位（推荐）');
};
slowSpeed.onclick = function() {
    intervalMinSec.value = 60; intervalMaxSec.value = 120;
    watchMinSec.value = 15; watchMaxSec.value = 30;
    addLog('切换慢速档位（最低风控）');
};

exportLogBtn.onclick = exportLog;
pendingUrlList.addEventListener('input', refreshCount);
window.onload = loadFromLocalStorage;
setInterval(saveToLocalStorage, 5000);
</script>
</body>
</html>

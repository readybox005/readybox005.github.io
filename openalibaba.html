<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>自动打开链接工具【专业日志版】</title>
<style>
* {margin:0;padding:0;box-sizing:border-box;}
body {padding:20px;font-family:微软雅黑, Arial;width:950px;margin:0 auto;line-height:1.8;position: relative;}

/* 右上角任务进度模块 */
.task-progress-panel {
    position: absolute;
    top: 20px;
    right: 20px;
    background: #e8f4f8;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
    color: #2c3e50;
    border: 1px solid #d1e7f5;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
}
.task-progress-panel span {
    color: #165DFF;
}

h2 {color:#2c3e50;text-align:center;margin-bottom:20px;}
.config {margin:15px 0;padding:10px;background:#f5f7fa;border-radius:6px;}
.config input {width:80px;padding:6px;margin:0 5px;border:1px solid #ddd;border-radius:4px;text-align:center;}
.speed-btns {margin:10px 0;padding:8px;background:#e8f4f8;border-radius:6px;text-align:center;}
.speed-btns button {padding:6px 12px;margin:0 5px;font-size:14px;}
.url-section {margin:15px 0;}
.url-section span {color:#3498db;font-weight:bold;display:block;margin-bottom:8px;}
textarea {width:100%;height:180px;padding:10px;border:1px solid #ddd;border-radius:6px;margin:5px 0;resize:none;font-size:14px;}
button {padding:10px 20px;margin:0 8px;border:none;border-radius:6px;font-size:16px;cursor:pointer;transition:all 0.2s;}
button:hover {opacity:0.9;transform:scale(1.02);}
#startBtn {background:#27ae60;color:#fff;}
#stopBtn {background:#e74c3c;color:#fff;}
#clearPendingBtn {background:#95a5a6;color:#fff;}
#clearCompletedBtn {background:#6c757d;color:#fff;}
#exportLogBtn {background:#165DFF;color:#fff;}
#clearLogBtn {background:#F59E0B;color:#fff;}
#status {margin-top:20px;font-size:16px;color:#e74c3c;font-weight:bold;text-align:center;}
.tips {margin-top:15px;padding:10px;background:#fff8e1;border:1px solid #ffeaa7;border-radius:6px;color:#6d4c41;font-size:13px;}
.section-divider {height:1px;background:#eee;margin:20px 0;}
.progress-container {margin:15px 0;padding:10px;background:#f8f9fa;border-radius:6px;}
.progress-bar {height:10px;background:#e9ecef;border-radius:5px;overflow:hidden;margin:8px 0;}
.progress-fill {height:100%;background:#27ae60;border-radius:5px;width:0%;transition:width 0.1s linear;}
.progress-label {font-size:14px;color:#495057;display:flex;justify-content:space-between;}
.log-section {margin:15px 0;}
.log-section span {color:#165DFF;font-weight:bold;display:block;margin-bottom:8px;}
#logArea {width:100%;height:220px;padding:10px;border:1px solid #ddd;border-radius:6px;margin:5px 0;resize:none;font-size:13px;line-height:1.5;background:#f9fafb;}
</style>
</head>
<body>
<!-- 右上角任务进度 -->
<div class="task-progress-panel">
    任务进度：<span id="taskProgressText">0/0</span>
</div>

<h2>自动打开链接工具【专业日志版】</h2>
<div class="speed-btns">
    ⚡ 执行速度档位：
    <button id="fastSpeed">快速（间隔5-10s/观看3-5s）</button>
    <button id="normalSpeed" style="background:#3498db;color:#fff;">普通（间隔20-60s/观看8-15s）</button>
    <button id="slowSpeed">慢速（间隔60-120s/观看15-30s）</button>
</div>
<div class="config">
    ✅ 打开下一个链接的间隔时间（随机区间）：<input type="number" id="intervalMinSec" value="20" min="1" step="1"> 秒 至 <input type="number" id="intervalMaxSec" value="60" min="1" step="1"> 秒
    ✅ 页面加载后观看并关闭的总耗时（随机区间）：<input type="number" id="watchMinSec" value="8" min="1" step="1"> 秒 至 <input type="number" id="watchMaxSec" value="15" min="1" step="1"> 秒
</div>
<div class="progress-container">
    <div class="progress-label">
        <span>当前链接观看进度：</span>
        <span id="watchProgressText">0% (0/0秒)</span>
    </div>
    <div class="progress-bar">
        <div class="progress-fill" id="watchProgressBar"></div>
    </div>
    <div class="progress-label">
        <span>下一个链接间隔进度：</span>
        <span id="intervalProgressText">0% (0/0秒)</span>
    </div>
    <div class="progress-bar">
        <div class="progress-fill" id="intervalProgressBar" style="background:#3498db;"></div>
    </div>
</div>
<div class="url-section">
    <span>📌 待执行链接（每行1个，执行后自动移除）：</span>
    <textarea id="pendingUrlList" placeholder="示例：&#10;https://www.baidu.com&#10;https://uutool.cn/url-open&#10;&#10;⚠️ 注意：请确保每行只有一个链接，不要有空格连接"></textarea>
</div>
<div class="section-divider"></div>
<div class="url-section">
    <span>✅ 已完成链接（自动累计，按执行顺序）：</span>
    <textarea id="completedUrlList" placeholder="执行后的链接会自动显示在这里..." readonly></textarea>
</div>
<div class="section-divider"></div>
<div class="log-section">
    <span>📝 实时执行日志（支持导出）：</span>
    <textarea id="logArea" readonly placeholder="执行日志将实时显示在这里..."></textarea>
    <div style="text-align:right;margin-top:5px;">
        <button id="clearLogBtn">🗑️ 清空日志</button>
        <button id="exportLogBtn">📤 导出日志(TXT)</button>
    </div>
</div>
<div style="text-align:center;margin:10px 0;">
    <button id="startBtn">▶️ 开始执行</button>
    <button id="stopBtn">⏹️ 停止执行</button>
    <button id="clearPendingBtn">🗑️ 清空待执行</button>
    <button id="clearCompletedBtn">🗑️ 清空已完成</button>
</div>
<div id="status">💡 就绪：请输入待执行链接后点击【开始执行】</div>
<div class="tips">
    ⚠️ <strong>重要提示</strong>：1. <strong>浏览器会拦截弹窗</strong>，首次点击后请在地址栏右侧选择【允许】；2. 脚本自动打开→观看→关闭；3. 仅支持http/https开头链接。<br>
</div>

<script>
const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');
const clearPendingBtn = document.getElementById('clearPendingBtn');
const clearCompletedBtn = document.getElementById('clearCompletedBtn');
const exportLogBtn = document.getElementById('exportLogBtn');
const clearLogBtn = document.getElementById('clearLogBtn');
const intervalMinSec = document.getElementById('intervalMinSec');
const intervalMaxSec = document.getElementById('intervalMaxSec');
const watchMinSec = document.getElementById('watchMinSec');
const watchMaxSec = document.getElementById('watchMaxSec');
const pendingUrlList = document.getElementById('pendingUrlList');
const completedUrlList = document.getElementById('completedUrlList');
const logArea = document.getElementById('logArea');
const status = document.getElementById('status');
const watchProgressBar = document.getElementById('watchProgressBar');
const watchProgressText = document.getElementById('watchProgressText');
const intervalProgressBar = document.getElementById('intervalProgressBar');
const intervalProgressText = document.getElementById('intervalProgressText');
const taskProgressText = document.getElementById('taskProgressText');

let isRunning = false;
let taskTimer = null;
let currentWin = null;
let progressTimer = null;
let completedCount = 0;
let totalUrlsCount = 0;

// 更新右上角任务进度
function updateTaskProgress() {
    taskProgressText.textContent = `${completedCount}/${totalUrlsCount}`;
}

// 获取格式化时间 [01:23:45 PM]
function getLogTime() {
    const now = new Date();
    let hours = now.getHours();
    const minutes = now.getMinutes().toString().padStart(2, '0');
    const seconds = now.getSeconds().toString().padStart(2, '0');
    const ampm = hours >= 12 ? 'PM' : 'AM';
    hours = hours % 12;
    hours = hours ? hours : 12;
    hours = hours.toString().padStart(2, '0');
    return `[${hours}:${minutes}:${seconds} ${ampm}]`;
}

// 写入日志
function addLog(text) {
    const time = getLogTime();
    logArea.value += `${time} ${text}\n`;
    logArea.scrollTop = logArea.scrollHeight;
}

// 随机数（保留1位小数）
function getRandom(min, max) {
    min = Number(min);
    max = Number(max);
    if (min > max) [min, max] = [max, min];
    const num = Math.random() * (max - min) + min;
    return Math.round(num * 10) / 10;
}

// 真实进度条动画
function startProgress(bar, textEl, totalSeconds) {
    let current = 0;
    clearInterval(progressTimer);
    bar.style.width = '0%';
    progressTimer = setInterval(() => {
        current++;
        if (current > totalSeconds) {
            clearInterval(progressTimer);
            bar.style.width = '100%';
            textEl.textContent = `100% (${totalSeconds}/${totalSeconds}秒)`;
            return;
        }
        const percent = (current / totalSeconds) * 100;
        bar.style.width = percent + '%';
        textEl.textContent = `${Math.round(percent)}% (${current}/${totalSeconds}秒)`;
    }, 1000);
}

// 清空进度条
function clearAllProgress() {
    clearInterval(progressTimer);
    watchProgressBar.style.width = '0%';
    intervalProgressBar.style.width = '0%';
    watchProgressText.textContent = '0% (0/0秒)';
    intervalProgressText.textContent = '0% (0/0秒)';
}

// 开始执行
startBtn.addEventListener('click', async () => {
    let urls = pendingUrlList.value
        .split('\n')
        .map(u => u.trim())
        .filter(u => u.startsWith('http'));

    if (urls.length === 0) {
        updateStatus('❌ 请输入有效链接', '#e74c3c');
        return;
    }

    const test = window.open('', '_blank');
    if (!test) {
        updateStatus('❌ 请允许弹窗！地址栏右侧点击允许', '#e74c3c');
        return;
    }
    test.close();

    isRunning = true;
    startBtn.disabled = true;
    clearAllProgress();
    
    // 重置任务计数
    if(completedCount === 0){
        totalUrlsCount = urls.length;
    }
    updateTaskProgress();
    
    addLog('▶️ 开始执行任务');
    updateStatus('✅ 正在执行...', '#27ae60');
    runTask(urls);
});

// 核心循环
async function runTask(urls) {
    if (!isRunning || urls.length === 0) {
        finishAll();
        return;
    }

    const url = urls.shift();
    pendingUrlList.value = urls.join('\n');
    completedCount++;
    updateTaskProgress(); // 更新右上角进度
    const remainCount = urls.length;

    addLog(`🔄 开始执行第${completedCount}个链接：${url}`);

    try {
        currentWin = window.open(url, '_blank');
        updateStatus(`✅ 正在打开：${url}`, '#27ae60');
    } catch (e) {
        addLog('❌ 打开链接失败：浏览器拦截');
        updateStatus('❌ 打开失败：浏览器拦截', '#e74c3c');
        next(urls);
        return;
    }

    // 观看时间
    const watchSec = getRandom(watchMinSec.value, watchMaxSec.value);
    const watchTime = watchSec * 1000;
    addLog(`⌛ 本次观看耗时：${watchSec}秒（滚动占80%，停留占20%）`);
    startProgress(watchProgressBar, watchProgressText, watchSec);
    await delay(watchTime);

    // 关闭
    try { if (currentWin && !currentWin.closed) currentWin.close(); } catch (e) {}

    completedUrlList.value += url + '\n';
    addLog(`✅ 完成执行：${url}（累计完成${completedCount}个）`);
    updateStatus(`✅ 已完成：${url}`, '#2980b9');
    next(urls);
}

// 间隔
function next(urls) {
    const intervalSec = getRandom(intervalMinSec.value, intervalMaxSec.value);
    const interval = intervalSec * 1000;
    addLog(`⌛ 下一个链接将在${intervalSec}秒后执行`);
    startProgress(intervalProgressBar, intervalProgressText, intervalSec);
    taskTimer = setTimeout(() => runTask(urls), interval);
}

// 全部完成
function finishAll() {
    isRunning = false;
    startBtn.disabled = false;
    clearAllProgress();
    addLog('🏁 所有链接执行完毕');
    updateStatus('🏁 全部执行完成', '#27ae60');
}

// 停止
stopBtn.addEventListener('click', () => {
    if (!isRunning) return;
    isRunning = false;
    clearTimeout(taskTimer);
    clearAllProgress();
    try { if (currentWin) currentWin.close(); } catch (e) {}
    startBtn.disabled = false;
    const remain = pendingUrlList.value.split('\n').filter(u => u.trim().startsWith('http')).length;
    addLog(`⏹️ 手动停止：累计完成${completedCount}个，剩余${remain}个`);
    updateStatus('⏹️ 已手动停止', '#95a5a6');
});

// 导出日志
exportLogBtn.addEventListener('click', () => {
    const content = logArea.value;
    if (!content) {
        alert('暂无日志可导出');
        return;
    }
    const blob = new Blob([content], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `执行日志_${new Date().toLocaleString().replace(/[\/: ]/g, '-')}.txt`;
    a.click();
    URL.revokeObjectURL(url);
});

// 清空日志
clearLogBtn.addEventListener('click', () => {
    logArea.value = '';
});

// 清空按钮 + 重置任务计数
clearPendingBtn.addEventListener('click', () => {
    pendingUrlList.value = '';
    completedCount = 0;
    totalUrlsCount = 0;
    updateTaskProgress();
});
clearCompletedBtn.addEventListener('click', () => {
    completedUrlList.value = '';
});

// 状态更新
function updateStatus(msg, color) {
    status.textContent = msg;
    status.style.color = color;
}

// 延时
function delay(ms) {
    return new Promise(res => setTimeout(res, ms));
}

// 速度档位
document.getElementById('fastSpeed').onclick = () => {
    intervalMinSec.value = 5; intervalMaxSec.value = 10;
    watchMinSec.value = 3; watchMaxSec.value = 5;
};
document.getElementById('normalSpeed').onclick = () => {
    intervalMinSec.value = 20; intervalMaxSec.value = 60;
    watchMinSec.value = 8; watchMaxSec.value = 15;
};
document.getElementById('slowSpeed').onclick = () => {
    intervalMinSec.value = 60; intervalMaxSec.value = 120;
    watchMinSec.value = 15; watchMaxSec.value = 30;
};
</script>
</body>
</html>
